<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | coding-block</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script>
      /* sparc-webgl-guards: iOS Safari crashes if Unity calls screen.orientation.lock */
      (function () {
        try {
          var o = screen.orientation;
          if (!o) screen.orientation = o = {};
          if (typeof o.lock !== "function") {
            o.lock = function () { return Promise.resolve(); };
          }
        } catch (e) {}
      })();
      /* sparc-fullscreen-error-guard */
      (function () {
        var orig = window.alert;
        window.alert = function (m) {
          if (typeof m === "string" && /Fullscreen request denied/i.test(m)) return;
          return orig.apply(this, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">coding-block</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function isAppleTouchDevice() {
        var ua = navigator.userAgent || "";
        if (/iPhone|iPad|iPod/i.test(ua)) return true;
        // iPadOS 13+ often reports as Macintosh desktop Safari.
        if (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) return true;
        return false;
      }

      function isMobileOrTablet() {
        return isAppleTouchDevice() || /Android/i.test(navigator.userAgent || "");
      }

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/unity.loader.js";
      var config = {
        dataUrl: buildUrl + "/5af24c766e8ebb223256e4df6527dc9e.data",
        frameworkUrl: buildUrl + "/08c82b9a4dfc3aeab02dd8616dece795.js",
        codeUrl: buildUrl + "/dae17c48fd1194157f0b11d7e831135c.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "coding-block",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      // Old iPads crash when rendering at full Retina scale + growing WASM heap.
      if (isMobileOrTablet()) {
        config.devicePixelRatio = 1;
        config.powerPreference = "low-power";
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      function fitGameToWindow() {
        var innerW = window.innerWidth;
        var innerH = window.innerHeight;
        if (window.visualViewport) {
          innerW = window.visualViewport.width;
          innerH = window.visualViewport.height;
        }
        var aspect = 16 / 9;
        var width = innerW;
        var height = width / aspect;
        if (height > innerH) {
          height = innerH;
          width = height * aspect;
        }
        width = Math.max(1, Math.floor(width));
        height = Math.max(1, Math.floor(height));
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        container.style.width = width + "px";
        container.style.height = height + "px";
      }

      window.addEventListener("resize", fitGameToWindow);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fitGameToWindow);
      }
      fitGameToWindow();

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                loadingBar.style.display = "none";
                // Never call Unity SetFullscreen on iPad/iPhone — it crashes Safari
                // ("A problem occurred with this webpage").
                if (fullscreenButton) {
                  fullscreenButton.style.display = "none";
                  fullscreenButton.onclick = null;
                }
                if (unityInstance && typeof unityInstance.SetFullscreen === "function" && isAppleTouchDevice()) {
                  unityInstance.SetFullscreen = function () { return; };
                }
              }).catch((message) => {
                if (typeof message === "string" && /Fullscreen request denied/i.test(message)) return;
                var text = String(message || "");
                if (/memory|out of memory|Array buffer allocation|WebAssembly/i.test(text)) {
                  alert("This device does not have enough free memory for the game. Close other tabs/apps and try again, or use a newer tablet/computer.");
                  return;
                }
                alert(message);
              });
            };

      document.body.appendChild(script);
    </script>
  </body>
</html>
