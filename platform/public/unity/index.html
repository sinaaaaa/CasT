<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebGL Player | coding-block</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>/* sparc-aspect-fit */html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;}#unity-container{position:relative!important;left:auto!important;top:auto!important;transform:none!important;margin:0;line-height:0;}#unity-canvas{display:block;}#unity-footer{display:none!important;}canvas,#unity-container,#unity-canvas{touch-action:none;-ms-touch-action:none;}</style>
    <script>/* StudentGameConfig bridge */try{if(window.parent&&window.parent.StudentGameConfig&&!window.StudentGameConfig)window.StudentGameConfig=window.parent.StudentGameConfig;}catch(e){}</script>
    <script>/* sparc-webgl-guards */(function(){try{var o=screen.orientation;if(!o)screen.orientation=o={};if(typeof o.lock!=='function')o.lock=function(){return Promise.resolve();};}catch(e){}})();</script>
    <script>/* sparc-fullscreen-error-guard */(function(){var orig=window.alert;window.alert=function(m){if(typeof m==='string'&&/Fullscreen request denied/i.test(m))return;return orig.apply(this,arguments);};})();</script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">coding-block</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      var DESIGN_W = 1920;
      var DESIGN_H = 1080;
      var DESIGN_ASPECT = DESIGN_W / DESIGN_H;

      function fitUnityStage() {
        var availW = window.innerWidth || document.documentElement.clientWidth || DESIGN_W;
        var availH = window.innerHeight || document.documentElement.clientHeight || DESIGN_H;
        var cssW, cssH;
        if (availW / Math.max(1, availH) > DESIGN_ASPECT) {
          cssH = availH;
          cssW = Math.floor(availH * DESIGN_ASPECT);
        } else {
          cssW = availW;
          cssH = Math.floor(availW / DESIGN_ASPECT);
        }
        cssW = Math.max(2, cssW);
        cssH = Math.max(2, cssH);
        container.style.width = cssW + "px";
        container.style.height = cssH + "px";
        canvas.style.width = cssW + "px";
        canvas.style.height = cssH + "px";
      }

      function unityShowBanner(msg, type) {
        if (type === 'error' && typeof msg === 'string' && /Fullscreen request denied/i.test(msg))
          return;
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/unity.loader.js";
      var config = {
        dataUrl: buildUrl + "/d7fe2563bcd409c147c0e6f72d38c656.data",
        frameworkUrl: buildUrl + "/1312a2f7b6c68cbc00bf8ce4e28ab199.js",
        codeUrl: buildUrl + "/472690fd98b8548c43977ea3b728f9a1.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "coding-block",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      fitUnityStage();
      window.addEventListener("resize", fitUnityStage);
      window.addEventListener("orientationchange", function () {
        setTimeout(fitUnityStage, 50);
      });

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                loadingBar.style.display = "none";
                fitUnityStage();
                if (fullscreenButton) {
                  fullscreenButton.onclick = function () { fitUnityStage(); };
                }
              }).catch((message) => {
                if (typeof message === 'string' && /Fullscreen request denied/i.test(message)) return;
                alert(message);
              });
            };

      document.body.appendChild(script);

      document.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });

    </script>
    <script>/* sparc-fullscreen-bridge */window.addEventListener('message',function(e){if(e.data!=='sparc-enter-fullscreen'&&e.data!=='sparc-exit-fullscreen')return;try{if(typeof fitUnityStage==='function')fitUnityStage();}catch(err){}});</script>
  </body>
</html>
